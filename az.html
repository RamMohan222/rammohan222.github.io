<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Responsive Carousel</title>

    <style>
        :root {
            --bg-color: #f0f2f5;
            --container-bg: #ffffff;
            --text-color: #333333;

            --btn-bg: #ffffff;
            --btn-border: #ccc;
            --btn-hover: #e4e6eb;
            --btn-hover-border: #adafb4;

            --mode-bg: #ffffff;
            --mode-color: #555;
            --mode-active-bg: #007bff;
            --mode-active-color: #ffffff;

            --shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #ffffff;

            --btn-bg: #2d2d2d;
            --btn-border: #444;
            --btn-hover: #3d3d3d;
            --btn-hover-border: #555;

            --mode-bg: #1e1e1e;
            --mode-color: #aaa;
            --mode-active-bg: #0d6efd;
            --mode-active-color: #ffffff;

            --shadow: rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            background-color: var(--bg-color);
            color: var(--text-color);

            min-height: 100dvh;

            display: flex;
            flex-direction: column;
            align-items: center;

            overflow: hidden;

            padding:
                max(20px, env(safe-area-inset-top))
                max(16px, env(safe-area-inset-right))
                max(20px, env(safe-area-inset-bottom))
                max(16px, env(safe-area-inset-left));

            transition:
                background-color 0.3s ease,
                color 0.3s ease;
        }

        /* =========================================
           TOP CONTROLS
           ========================================= */

        .top-controls {
            width: min(100%, 650px);

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;

            margin-top: 10px;
        }

        .theme-btn {
            background-color: var(--btn-bg);
            border: 2px solid var(--btn-border);
            color: var(--text-color);

            padding: 9px 14px;

            font-size: 14px;
            font-weight: 600;

            border-radius: 10px;
            cursor: pointer;

            box-shadow: 0 4px 6px var(--shadow);

            transition: all 0.2s ease;

            white-space: nowrap;
        }

        .theme-btn:hover {
            background-color: var(--btn-hover);
            border-color: var(--btn-hover-border);
            transform: scale(1.03);
        }

        .mode-container {
            display: flex;
            gap: 4px;

            background: var(--mode-bg);

            padding: 5px;
            border-radius: 12px;

            box-shadow: 0 4px 6px var(--shadow);

            transition:
                background-color 0.3s ease,
                box-shadow 0.3s ease;
        }

        .mode-btn {
            background-color: transparent;
            border: none;

            padding: 7px 12px;

            font-size: 14px;
            font-weight: 600;

            border-radius: 8px;

            cursor: pointer;

            color: var(--mode-color);

            transition: all 0.2s ease;

            min-width: 52px;
        }

        .mode-btn.active {
            background-color: var(--mode-active-bg);
            color: var(--mode-active-color);

            box-shadow:
                0 2px 4px rgba(0, 123, 255, 0.3);
        }

        /* =========================================
           MAIN CAROUSEL
           ========================================= */

        .container {
            width: 100%;
            max-width: 850px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: clamp(10px, 4vw, 30px);

            flex: 1;

            min-height: 0;
        }

        /* =========================================
           NAVIGATION BUTTONS
           ========================================= */

        .btn {
            background-color: var(--btn-bg);
            border: 2px solid var(--btn-border);
            color: var(--text-color);

            width: clamp(44px, 9vw, 60px);
            height: clamp(44px, 9vw, 60px);

            font-size: clamp(18px, 4vw, 24px);

            border-radius: 50%;

            cursor: pointer;

            display: flex;
            justify-content: center;
            align-items: center;

            box-shadow: 0 4px 6px var(--shadow);

            transition: all 0.2s ease;

            flex-shrink: 0;

            /* Better touch target */
            touch-action: manipulation;

            -webkit-tap-highlight-color: transparent;
        }

        .btn:hover {
            background-color: var(--btn-hover);
            border-color: var(--btn-hover-border);
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* =========================================
           DISPLAY
           ========================================= */

        .display-box {
            width: min(60vw, 500px);
            aspect-ratio: 1 / 1;

            background-color: var(--container-bg);

            border-radius: clamp(14px, 4vw, 20px);

            box-shadow: 0 10px 25px var(--shadow);

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            transition:
                background-color 0.3s ease,
                box-shadow 0.3s ease;

            flex-shrink: 1;
        }

        #itemDisplay {
            font-size: clamp(120px, 32vw, 360px);

            font-weight: bold;
            line-height: 0.9;

            user-select: none;
            -webkit-user-select: none;

            transition: color 0.3s ease;

            /* Prevent accidental wrapping */
            white-space: nowrap;
        }

        /* =========================================
           RESET BUTTON
           ========================================= */

        .reset-container {
            width: 100%;

            display: flex;
            justify-content: center;

            margin-top: 10px;
        }

        .reset-btn {
            background-color: var(--mode-active-bg);
            color: white;

            border: none;

            padding: 11px 22px;

            font-size: 16px;
            font-weight: 600;

            border-radius: 8px;

            cursor: pointer;

            box-shadow: 0 4px 6px var(--shadow);

            transition:
                background-color 0.2s ease,
                transform 0.1s ease;

            touch-action: manipulation;

            -webkit-tap-highlight-color: transparent;
        }

        .reset-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .reset-btn:active {
            transform: scale(0.98);
        }

        /* =========================================
           TABLET
           ========================================= */

        @media (max-width: 768px) {

            .top-controls {
                margin-top: 0;
            }

            .container {
                gap: 16px;
            }

            .display-box {
                width: min(62vw, 400px);
            }

            #itemDisplay {
                font-size: clamp(120px, 34vw, 300px);
            }
        }

        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 600px) {

            body {
                padding-top: max(12px, env(safe-area-inset-top));
                padding-bottom: max(16px, env(safe-area-inset-bottom));
            }

            .top-controls {
                flex-direction: column;
                justify-content: center;

                gap: 12px;

                margin-top: 0;
            }

            .theme-btn {
                font-size: 13px;
                padding: 8px 12px;
            }

            .mode-container {
                width: 100%;
                max-width: 280px;

                justify-content: center;
            }

            .mode-btn {
                flex: 1;
                min-width: 0;
            }

            .container {
                flex: 1;

                gap: 8px;

                width: 100%;
            }

            .display-box {
                width: min(68vw, 330px);

                border-radius: 16px;
            }

            #itemDisplay {
                font-size: min(45vw, 220px);
            }

            .btn {
                width: 48px;
                height: 48px;

                font-size: 20px;
            }

            .reset-container {
                margin-top: 8px;
            }

            .reset-btn {
                padding: 10px 20px;
                font-size: 14px;
            }
        }

        /* =========================================
           SMALL PHONES
           ========================================= */

        @media (max-width: 380px) {

            .top-controls {
                gap: 8px;
            }

            .mode-container {
                max-width: 250px;
            }

            .mode-btn {
                font-size: 12px;
                padding: 6px 8px;
            }

            .container {
                gap: 5px;
            }

            .display-box {
                width: 66vw;
            }

            #itemDisplay {
                font-size: 42vw;
            }

            .btn {
                width: 42px;
                height: 42px;

                font-size: 18px;
            }

            .reset-btn {
                padding: 9px 18px;
                font-size: 13px;
            }
        }

        /* =========================================
           LANDSCAPE MOBILE
           ========================================= */

        @media (max-height: 500px) and (orientation: landscape) {

            body {
                padding-top: 10px;
                padding-bottom: 10px;
            }

            .top-controls {
                flex-direction: row;

                width: 100%;

                margin-bottom: 5px;
            }

            .container {
                gap: 12px;
            }

            .display-box {
                height: min(65vh, 300px);
                width: auto;
            }

            #itemDisplay {
                font-size: min(38vh, 220px);
            }

            .reset-container {
                margin-top: 5px;
            }

            .reset-btn {
                padding: 7px 16px;
                font-size: 13px;
            }
        }

        /* =========================================
           ACCESSIBILITY
           ========================================= */

        button:focus-visible {
            outline: 3px solid var(--mode-active-bg);
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body data-theme="light">

    <!-- Top Controls -->
    <div class="top-controls">

        <button class="theme-btn" id="themeBtn">
            🌙 Dark Theme
        </button>

        <div class="mode-container">
            <button class="mode-btn active" data-mode="uppercase">
                A-Z
            </button>

            <button class="mode-btn" data-mode="lowercase">
                a-z
            </button>

            <button class="mode-btn" data-mode="numbers">
                0-9
            </button>
        </div>

    </div>

    <!-- Carousel -->
    <div class="container">

        <button
            class="btn"
            id="prevBtn"
            title="Previous"
            aria-label="Previous">
            &#10094;
        </button>

        <div class="display-box">
            <span id="itemDisplay">A</span>
        </div>

        <button
            class="btn"
            id="nextBtn"
            title="Next"
            aria-label="Next">
            &#10095;
        </button>

    </div>

    <!-- Reset -->
    <div class="reset-container">
        <button class="reset-btn" id="resetBtn">
            Reset Colors
        </button>
    </div>

    <script>

        const sets = {
            uppercase: "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""),
            lowercase: "abcdefghijklmnopqrstuvwxyz".split(""),
            numbers: "0123456789".split("")
        };

        let currentMode = "uppercase";
        let currentIndex = 0;

        const itemDisplay =
            document.getElementById("itemDisplay");

        const prevBtn =
            document.getElementById("prevBtn");

        const nextBtn =
            document.getElementById("nextBtn");

        const resetBtn =
            document.getElementById("resetBtn");

        const modeBtns =
            document.querySelectorAll(".mode-btn");

        const themeBtn =
            document.getElementById("themeBtn");

        const bodyEl =
            document.body;


        function getRandomColor() {

            const letters =
                "0123456789ABCDEF";

            let color = "#";

            for (let i = 0; i < 6; i++) {
                color +=
                    letters[
                        Math.floor(
                            Math.random() * 16
                        )
                    ];
            }

            return color;
        }


        function updateDisplay() {

            const currentSet =
                sets[currentMode];

            itemDisplay.textContent =
                currentSet[currentIndex];

            itemDisplay.style.color =
                getRandomColor();
        }


        nextBtn.addEventListener("click", () => {

            const currentSet =
                sets[currentMode];

            currentIndex =
                (currentIndex + 1) %
                currentSet.length;

            updateDisplay();
        });


        prevBtn.addEventListener("click", () => {

            const currentSet =
                sets[currentMode];

            currentIndex =
                (currentIndex - 1 +
                    currentSet.length) %
                currentSet.length;

            updateDisplay();
        });


        resetBtn.addEventListener("click", () => {

            itemDisplay.style.color =
                getRandomColor();
        });


        modeBtns.forEach(btn => {

            btn.addEventListener("click", () => {

                modeBtns.forEach(b =>
                    b.classList.remove("active")
                );

                btn.classList.add("active");

                currentMode =
                    btn.getAttribute("data-mode");

                currentIndex = 0;

                updateDisplay();
            });

        });


        themeBtn.addEventListener("click", () => {

            const currentTheme =
                bodyEl.getAttribute("data-theme");

            if (currentTheme === "light") {

                bodyEl.setAttribute(
                    "data-theme",
                    "dark"
                );

                themeBtn.textContent =
                    "☀️ Light Theme";

            } else {

                bodyEl.setAttribute(
                    "data-theme",
                    "light"
                );

                themeBtn.textContent =
                    "🌙 Dark Theme";
            }

        });


        /* Keyboard navigation */

        document.addEventListener("keydown", event => {

            if (event.key === "ArrowRight") {
                nextBtn.click();
            }

            if (event.key === "ArrowLeft") {
                prevBtn.click();
            }

        });


        /* Initial display */

        updateDisplay();

    </script>
</body>
</html>
